<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Örökbefogadás – Pónifarm 🦄</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav id="menu">
    <a href="index.html">Főoldal</a>
    <a href="ponies.html">Ponik</a>
    <a href="adoption.html">Örökbefogadás</a>
    <a href="gallery.html">Galéria</a>
  </nav>

  <header>
    <h1>Fogadj örökbe egy ponit! 💖</h1>
    <p>Töltsd ki az űrlapot, és hamarosan jelentkezünk.</p>
  </header>

  <main>
    <div class="box">
      <h2>Jelentkezési űrlap</h2>

      <form id="adoption-form">

        <div class="field">
          <label for="name">Neved:</label>
          <input type="text" id="name" name="name" placeholder="Pl. Kiss Anna">
          <span class="error" id="name-error"></span>
        </div>

        <div class="field">
          <label for="reason">Miért te leszel a legjobb gazdi?</label>
          <textarea id="reason" name="reason" rows="5" cols="40"></textarea>
          <span class="error" id="reason-error"></span>
        </div>

        <div class="field">
          <p>Melyik ponit választanád?</p>
          <input type="radio" id="pony-pillecukor" name="pony" value="Pillecukor">
          <label for="pony-pillecukor">Pillecukor</label>
          <input type="radio" id="pony-csillag" name="pony" value="Csillag">
          <label for="pony-csillag">Csillag</label>
          <input type="radio" id="pony-szivarvany" name="pony" value="Szivárvány">
          <label for="pony-szivarvany">Szivárvány</label>
          <span class="error" id="pony-error"></span>
        </div>

        <div class="field">
          <p>Mit tudsz biztosítani?</p>
          <input type="checkbox" id="offer-stable" name="offer" value="stable">
          <label for="offer-stable">Istálló</label>
          <input type="checkbox" id="offer-pasture" name="offer" value="pasture">
          <label for="offer-pasture">Legelő</label>
          <input type="checkbox" id="offer-love" name="offer" value="love">
          <label for="offer-love">Rengeteg szeretet</label>
        </div>

        <div class="field">
          <label for="mane-color">Milyen színű legyen a sörénye?</label>
          <input type="color" id="mane-color" name="mane-color" value="#ff99cc">
        </div>

        <div class="field">
          <label for="visit-date">Mikor látogatnál el hozzánk?</label>
          <input type="date" id="visit-date" name="visit-date">
          <span class="error" id="visit-date-error"></span>
        </div>

        <div class="field">
          <input type="checkbox" id="accept" name="accept">
          <label for="accept">Elfogadom, hogy a ponit szeretni kell! ❤️</label>
          <span class="error" id="accept-error"></span>
        </div>

        <div class="field">
          <button type="submit" id="submit-btn">Jelentkezem!</button>
          <button type="reset" id="reset-btn">Törlés</button>
        </div>

      </form>

      <div id="result"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Pónifarm</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/validation.js"></script>

</body>
</html>
